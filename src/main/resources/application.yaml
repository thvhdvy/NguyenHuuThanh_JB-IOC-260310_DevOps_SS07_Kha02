spring:
  application:
    name: user-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/quickbite_user_db}
    username: ${DB_USER:quickbite}
    password: ${DB_PASSWORD:quickbite}
  jpa:
    hibernate:
      ddl-auto: update

server:
  port: ${PORT:8081}

management:
  endpoints:
    web:
      base-path: /api/v1/users/actuator
      exposure:
        include: health
